name: Google Maps Listing Crawler (Working Config)
content_type: listing_crawler
browser:
  automation: pinchtab
  headless: true
  page_wait_seconds: 5.0
pinchtab:
  server_url: http://127.0.0.1:9867
  instance_url: http://127.0.0.1:9868
  navigate_timeout: 90
queue:
  strategy: redis_queue
  config:
    host: localhost
    port: 6379
    db: 0
    ignore_completed_on_enqueue: true
    keys:
      pending: gmaps:pending
      processing: gmaps:processing
      completed: gmaps:completed
      failed: gmaps:failed
    visibility_timeout: 300
navigation:
  strategy: tab_navigator
  config:
    tabs:
    - name: Overview
      selector: '[role="tab"][aria-label^="Overview"]'
      required: true
      wait_for_selector: div[role='main']
      max_wait: 4
    - name: Reviews
      selector: '[role="tab"][aria-label^="Reviews"]'
      wait_for_selector: div[role='main']
      max_wait: 3
    - name: About
      selector: '[role="tab"][aria-label^="About"]'
      wait_for_selector: div[role='region']
      max_wait: 2
extraction:
  strategy: multi_step
  config:
    steps:
    - action: extract
      fields:
        name:
          selector: h1.DUwDvf
          selectors:
          - h1.DUwDvf
          - .qBF1Pd.fontHeadlineSmall
          type: text
        rating:
          selector: div.F7nice [role='img']
          selectors:
          - div.F7nice [role='img']
          - div.F7nice span[aria-label*='stars']
          - span[aria-label*='stars']
          type: attribute
          attribute: aria-label
          regex: ([0-9.]+)
        review_count:
          selector: div.F7nice span[role='img'][aria-label*='reviews']
          selectors:
          - div.F7nice span[role='img'][aria-label*='reviews']
          - div.F7nice [aria-label*='reviews']
          - span[aria-label*='reviews']
          - button[aria-label*='reviews']
          type: attribute
          attribute: aria-label
          regex: ([\d,]+)\s*
    - action: transform
      field: review_count
      operation: remove_commas
    - action: extract
      fields:
        phone:
          selector: button[data-item-id^='phone']
          selectors:
          - button[data-item-id^='phone']
          - a[href^='tel:']
          type: text
          transform: normalize_phone
        website:
          selector: a[data-item-id='authority']
          selectors:
          - a[data-item-id='authority']
          - a[aria-label*='Website']
          - a[data-tooltip='Open website']
          type: attribute
          attribute: href
        address:
          selector: button[data-item-id='address']
          selectors:
          - button[data-item-id='address']
          - button[data-item-id='address'] .Io6YTe
          type: text
        category:
          selector: button[jsaction*='category']
          selectors:
          - button[jsaction*='category']
          - button[aria-label*='Category']
          type: text
          retry:
            enabled: true
            attempts: 1
            delay: 0
        plus_code:
          selector: button[data-item-id='oloc']
          selectors:
          - button[data-item-id='oloc']
          type: text
          retry:
            enabled: true
            attempts: 1
            delay: 0
    - action: transform
      field: phone
      operation: normalize_phone
    - action: transform
      field: address
      operation: clean_address
    - action: js_extract
      script: "(function() {\n  var main = document.querySelector('[role=\"main\"\
        ]');\n  if (!main) return {};\n  var result = {};\n\n  function normalizeDigits(text)\
        \ {\n    if (!text) return text;\n    return text.replace(/[০-৯]/g, function(d)\
        \ {\n      return String.fromCharCode(d.charCodeAt(0) - 0x09E6 + 0x30);\n\
        \    }).replace(/[٠-٩]/g, function(d) {\n      return String.fromCharCode(d.charCodeAt(0)\
        \ - 0x0660 + 0x30);\n    });\n  }\n\n  try {\n    var phoneBtn = main.querySelector('button[data-item-id^=\"\
        phone\"]');\n    if (phoneBtn) {\n      var aria = phoneBtn.getAttribute(\"\
        aria-label\") || \"\";\n      var text = (phoneBtn.innerText || \"\").trim();\n\
        \      var combined = normalizeDigits(aria + \" \" + text);\n      var m =\
        \ combined.match(/(\\+?[\\d\\s-]{7,}\\d|[\\d\\+][\\d\\s-]{7,}\\d)/);\n   \
        \   if (m) result.phone = m[0].replace(/\\s+/g, \"\").replace(/^-/, \"\");\n\
        \    }\n  } catch(e) {}\n\n  try {\n    var links = Array.from(main.querySelectorAll('a[href^=\"\
        http\"]'));\n    for (var i = 0; i < links.length; i++) {\n      var a = links[i];\n\
        \      var href = a.getAttribute(\"href\") || \"\";\n      if (href.indexOf(\"\
        google.com\") !== -1) continue;\n      if ((a.innerText || \"\").trim().length\
        \ > 2) {\n        result.website = href;\n        break;\n      }\n    }\n\
        \  } catch(e) {}\n\n  try {\n    var addrBtn = main.querySelector('button[data-item-id=\"\
        address\"]');\n    if (addrBtn) {\n      var text = (addrBtn.innerText ||\
        \ \"\").trim();\n      result.address = text.replace(/^[^\\w\\u0980-\\u09FF]+/,\
        \ \"\").trim();\n    }\n  } catch(e) {}\n\n  try {\n    var ratingImg = main.querySelector('div.F7nice\
        \ [role=\"img\"]');\n    if (ratingImg) {\n      var aria = ratingImg.getAttribute(\"\
        aria-label\") || \"\";\n      var normalized = normalizeDigits(aria);\n  \
        \    var m = normalized.match(/(\\d+[.,]\\d+)/);\n      if (m) result.rating\
        \ = m[1].replace(\",\", \".\");\n    }\n  } catch(e) {}\n\n  try {\n    var\
        \ reviewEls = main.querySelectorAll('[aria-label], button[jsaction*=\"review\"\
        ]');\n    for (var i = 0; i < reviewEls.length; i++) {\n      var el = reviewEls[i];\n\
        \      var aria = el.getAttribute(\"aria-label\") || \"\";\n      var text\
        \ = (el.innerText || \"\").trim();\n      var combined = normalizeDigits(aria\
        \ + \" \" + text);\n      if (/\\d+/.test(combined) && /review|পর্যালোচনা|রিভিউ/i.test(combined))\
        \ {\n        var m = combined.match(/(\\d+)/);\n        if (m) { result.review_count\
        \ = m[1]; break; }\n      }\n    }\n  } catch(e) {}\n\n  try {\n    var catBtn\
        \ = main.querySelector('button[jsaction*=\"category\"]');\n    if (catBtn)\
        \ {\n      result.category = (catBtn.innerText || \"\").trim();\n    }\n \
        \ } catch(e) {}\n\n  try {\n    var pcBtn = main.querySelector('button[data-item-id=\"\
        oloc\"]');\n    if (pcBtn) {\n      result.plus_code = (pcBtn.innerText ||\
        \ \"\").trim();\n    }\n  } catch(e) {}\n\n  try {\n    var canonical = document.querySelector('link[rel=\"\
        canonical\"]');\n    if (canonical) {\n      var href = canonical.getAttribute(\"\
        href\") || \"\";\n      var m = href.match(/place\\/([^\\/?]+)/);\n      if\
        \ (m) result.place_id = m[1];\n    }\n  } catch(e) {}\n\n  return result;\n\
        })()"
    - action: extract_url
      fields:
        latitude:
          pattern: '!3d(-?[0-9.]+)'
        longitude:
          pattern: '!4d(-?[0-9.]+)'
        place_id:
          pattern: '!1s([A-Za-z0-9_:]+)'
  retry:
    enabled: true
    attempts: 2
    delay: 1
    backoff: exponential
  timeouts:
    page_load: 30
    element: 1
output:
  strategy: postgresql_listing_upsert
  config:
    host: /var/run/postgresql
    port: 5432
    user: postgres
    database: infinitecrawler
    schema: scraper
    table: gmaps_listings
    key_field: place_id
    source_type: gmaps_listing
    max_results: 100000
    recreate_table: false
rate_limiting:
  page_load:
  - 0.5
  - 1.0
  between_requests:
  - 1
  - 2
  between_tabs:
  - 0.3
  - 0.8
  distribution: random
  max_retries: 3
  retry_delay:
  - 30
  - 60
retry:
  url_attempts: 3
  delay: 5
  restart_browser: true
workers:
  count: 3
  max_consecutive_errors: 15
  max_pages_per_session: 100
