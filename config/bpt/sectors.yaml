# ── LinkedIn Jobs crawler config ──────────────────────────────────────────
# Drives the LinkedIn jobs-guest scraper (see docs/LINKEDIN_SCRAPER_PLAN.md).
# Queries = linkedin_keywords × locations. Kept here so jobs scraping scales
# automatically whenever a sector is added/activated above.

linkedin_jobs:
  # LinkedIn guest guest-search `location` param values (must match LinkedIn geo names)
  locations:
    # Bangladesh — primary market (10), gets the FULL keyword matrix
    # (universal + every sector), because the niche vocabs are BD-specific.
    - "Dhaka, Bangladesh"
    - "Chattogram, Bangladesh"
    - "Bangladesh"
    - "Sylhet, Bangladesh"
    - "Khulna, Bangladesh"
    - "Rajshahi, Bangladesh"
    - "Barishal, Bangladesh"
    - "Rangpur, Bangladesh"
    - "Mymensingh, Bangladesh"
    - "Cumilla, Bangladesh"
    # 2026-09-18 — global expansion. Only universal keywords + the
    # `global_expansion_sectors` below run against these locations —
    # BD-local vocab (merchandiser, MFS, garments) doesn't load overseas.
    #
    # North America
    - "United States"
    - "New York, United States"
    - "San Francisco, United States"
    - "Toronto, Canada"
    - "Canada"
    # Europe / UK
    - "United Kingdom"
    - "London, United Kingdom"
    - "Berlin, Germany"
    - "Germany"
    - "Amsterdam, Netherlands"
    - "Paris, France"
    - "Ireland"
    - "Poland"
    - "Spain"
    # APAC
    - "India"
    - "Bangalore, India"
    - "Mumbai, India"
    - "Singapore"
    - "Australia"
    - "Sydney, Australia"
    - "Japan"
    - "Hong Kong"
