name: "Google Maps"
content_type: "dynamic"

browser:
  automation: "nodriver"
  headless: true
  # Maximum time to wait for page to become ready.
  # The ready_selector polls every 2s so the actual wait
  # is only as long as the page needs (often 20-35s for Maps).
  page_wait_seconds: 60.0
  # Poll for result links to appear instead of fixed sleep.
  ready_selector: "a.hfpxzc"

pagination_strategy: "infinite_scroll"
extraction_strategy: "google_maps"

search_url_template: "https://www.google.com/maps/search/{query}/"

selectors:
  items: "a.hfpxzc"

pagination:
  container: "div[role='feed']"
  scroll_script: "document.querySelector('div[role=\"feed\"]').scrollTo(0, document.querySelector('div[role=\"feed\"]').scrollHeight)"
  max_scroll_attempts: 500
  items_selector: "a.hfpxzc"

output:
  strategy: "postgresql_listing_upsert"
  config:
    schema: "scraper"
    table: "gmaps_listings"
    source_type: "google_maps_search"
    key_field: "source_url"

rate_limit: 2
proxy_rotation: false
