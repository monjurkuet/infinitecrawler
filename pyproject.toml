[project]
name = "infinitecrawler"
version = "1.0.0"
description = "Continuous 24/7 Google Maps lead generation pipeline with systemd daemons"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.1.0",
    "aiohttp>=3.13.0",
    "psycopg[binary,pool]>=3.2.6",
    "pyyaml>=6.0.3",
    "redis>=5.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
    "ddgs>=9.14.4",
    "indic-transliteration>=2.3.82",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
# Ruff is Python-only; explicit exclude keeps non-Python files out of its
# scan list so shell/yaml/markdown files don't trigger false-positive parse errors.
extend-exclude = [
    "*.sh",
    "*.yaml",
    "*.yml",
    "*.md",
    "*.json",
    "*.jsonl",
    "*.sql",
    "backups",
    "logs",
    "output",
]

[tool.ruff.lint]
# Default rule set (E4/E7/E9 + F). Expand selectively when the codebase has
# been cleaned up for that rule group — adding 'I' / 'UP' / 'B' all-at-once
# surfaced 727 pre-existing warnings (untouched code) on the 2026-08-07 audit.
# Keep this minimal and intentional.
select = ["E4", "E7", "E9", "F"]

